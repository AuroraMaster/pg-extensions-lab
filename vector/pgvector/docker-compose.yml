services:
  pg-pgvector:
    build: .
    image: pgxlab/pgvector:17-0.8
    environment:
      POSTGRES_PASSWORD: pgxlab
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab"]
      interval: 5s
      retries: 10

volumes:
  pgvector-data:
